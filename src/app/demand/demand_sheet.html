<div class="min-h-screen bg-gray-50 py-2 demand-sheet-page">
  <div class="max-w-6xl mx-auto px-4">
    <div class="flex justify-between items-center mb-6">
      <h2 class="text-2xl font-bold text-gray-900">Demand Sheet</h2>
      <button (click)="submit()" [disabled]="submitting() || !isValid()" class="bg-blue-600 text-white px-4 py-2 rounded-lg hover:bg-blue-700 disabled:opacity-50">
        ✏️ Create Demand
      </button>
    </div>

    <div *ngIf="errorMsg()" class="mb-4 p-3 rounded border border-red-200 bg-red-50 text-red-700">{{ errorMsg() }}</div>
    <div *ngIf="successMsg()" class="mb-4 p-3 rounded border border-green-200 bg-green-50 text-green-700">{{ successMsg() }}</div>

    <div class="demand-card p-6">
      <form (ngSubmit)="submit()" class="grid grid-cols-1 md:grid-cols-2 gap-6">
        <!-- Client -->
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Client <span class="text-red-600">*</span></label>
          <select [(ngModel)]="form().client_id" name="client_id" (change)="onClientChange()"
                  class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-green-500 focus:ring-green-500">
            <option value="">Select client</option>
            <option *ngFor="let c of clients()" [value]="c.id">{{ c.name || c['client_name'] || ('Client #' + c.id) }}</option>
          </select>
        </div>

        <!-- SPOC -->
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">SPOC <span class="text-red-600">*</span></label>
          <select [(ngModel)]="form().spoc_id" name="spoc_id"
                  class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-green-500 focus:ring-green-500">
            <option value="">Select SPOC</option>
            <option *ngFor="let s of spocs()" [value]="s.id">{{ s.name || s['spoc_name'] || s.email || ('SPOC #' + s.id) }}</option>
          </select>
        </div>

        <!-- Skills -->
        <div class="md:col-span-2">
          <label class="block text-sm font-medium text-gray-700 mb-1">Skills</label>
          <textarea [(ngModel)]="form().skills" name="skills" rows="2"
                    placeholder="e.g., Java, Spring Boot, Microservices"
                    class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-green-500 focus:ring-green-500"></textarea>
        </div>

        <!-- No. of Positions -->
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">No. of Positions</label>
          <input [(ngModel)]="form().no_of_positions" name="no_of_positions" type="number" min="0"
                 class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-green-500 focus:ring-green-500" />
        </div>

        <!-- Priority -->
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Priority</label>
          <select [(ngModel)]="form().priority" name="priority"
                  class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-green-500 focus:ring-green-500">
            <option value="Low">Low</option>
            <option value="Medium">Medium</option>
            <option value="High">High</option>
          </select>
        </div>

        <!-- Job Description URL -->
        <div class="md:col-span-2">
          <label class="block text-sm font-medium text-gray-700 mb-1">Job Description (URL)</label>
          <input [(ngModel)]="form().job_description_url" name="job_description_url" type="url" placeholder="https://..."
                 class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-green-500 focus:ring-green-500" />
        </div>

        <!-- Remarks -->
        <div class="md:col-span-2">
          <label class="block text-sm font-medium text-gray-700 mb-1">Remarks</label>
          <textarea [(ngModel)]="form().remarks" name="remarks" rows="2"
                    class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-green-500 focus:ring-green-500"></textarea>
        </div>

        <!-- Status (readonly default) -->
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Status</label>
          <input [value]="form().status" disabled class="mt-1 block w-full bg-gray-100 rounded-md border-gray-300" />
        </div>

        <!-- Actions -->
        <div class="md:col-span-2 flex items-center gap-3 pt-2">
          <button type="submit" [disabled]="submitting() || !isValid()"
                  class="inline-flex items-center px-4 py-2 rounded-md text-white bg-green-600 hover:bg-green-700 disabled:opacity-50">
            <svg *ngIf="submitting()" class="animate-spin -ml-1 mr-2 h-4 w-4 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
              <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
              <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v4a4 4 0 00-4 4H4z"></path>
            </svg>
            Submit
          </button>
          <button type="button" (click)="resetForm()"
                  class="px-4 py-2 rounded-md border border-gray-300 text-gray-700 bg-white hover:bg-gray-50">
            Reset
          </button>
        </div>
      </form>
    </div>
  </div>
</div>
