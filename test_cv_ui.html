<!DOCTYPE html>
<html>
<head>
    <title>CV Received Test</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .debug { background: #f0f0f0; padding: 10px; margin: 10px 0; border-radius: 5px; }
        table { border-collapse: collapse; width: 100%; margin: 20px 0; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
        th { background-color: #f2f2f2; }
        .status-waiting { background: #fef3c7; color: #d97706; padding: 4px 8px; border-radius: 12px; font-size: 12px; }
        .btn-approve { background: #dcfce7; color: #166534; padding: 6px 12px; border-radius: 6px; border: none; cursor: pointer; }
        .btn-reject { background: #fee2e2; color: #dc2626; padding: 6px 12px; border-radius: 6px; border: none; cursor: pointer; }
    </style>
</head>
<body>
    <h1>CV Received Tab Test</h1>
    
    <div class="debug">
        <strong>Test Data:</strong><br>
        This shows what the CV Received tab should display
    </div>
    
    <table>
        <thead>
            <tr>
                <th>Candidate Name</th>
                <th>Recruiter</th>
                <th>Client</th>
                <th>Skill</th>
                <th>Upload Date</th>
                <th>CV Link</th>
                <th>Status</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>John Doe</td>
                <td>Test Recruiter</td>
                <td>Test Client</td>
                <td>React Developer</td>
                <td>2024-01-20</td>
                <td><a href="https://example.com/cv.pdf" target="_blank">View CV</a></td>
                <td><span class="status-waiting">Waiting</span></td>
                <td>
                    <button class="btn-approve">✓ Approve</button>
                    <button class="btn-reject">✗ Reject</button>
                </td>
            </tr>
        </tbody>
    </table>
    
    <div class="debug">
        <strong>API Test:</strong><br>
        <button onclick="testAPI()">Test CV Received API</button>
        <div id="apiResult"></div>
    </div>
    
    <script>
        async function testAPI() {
            try {
                const response = await fetch('http://localhost:8000/cv-received');
                const data = await response.json();
                document.getElementById('apiResult').innerHTML = 
                    '<pre>' + JSON.stringify(data, null, 2) + '</pre>';
            } catch (error) {
                document.getElementById('apiResult').innerHTML = 
                    'Error: ' + error.message;
            }
        }
    </script>
</body>
</html>
